map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream thorn {
    server thorn:23400 max_fails=3 fail_timeout=30s;
}
upstream caipirinha {
    server caipirinha:23401 max_fails=3 fail_timeout=30s;
}
upstream limonero {
    server limonero:23402 max_fails=3 fail_timeout=30s;
}
upstream tahiti {
    server tahiti:23403 max_fails=3 fail_timeout=30s;
}
upstream stand {
    server stand:23404 max_fails=3 fail_timeout=30s;
}

# upstream seed {
#    server seed:23405 max_fails=3 fail_timeout=30s;
#}

# $uri has no query string: ?token= and ?api_token= must not reach the logs
log_format lemonade_noqs '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent';

proxy_cache_path /tmp/custom_nginx keys_zone=token_responses:10m;
proxy_temp_path /tmp/proxy_tmp 1 2;

server {
    resolver 127.0.0.11;
    listen 8080;
    client_max_body_size 250M;
    client_body_buffer_size    100M;
    client_body_in_single_buffer on;
    access_log /var/log/nginx/access.log lemonade_noqs;

    # CORS preflight for every location (an `if` inside a parent location is
    # skipped when a nested location matches, so it must live at server level)
    if ($request_method = OPTIONS) {
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers;
        add_header Access-Control-Allow-Credentials true;
        add_header Vary Origin;
        return 200;
    }

    root   /usr/local/citrus/dist;
    index  index.html index.htm;
    location / {
        location = /auth/internal {
            internal;
            proxy_method      POST;
            proxy_set_header  Content-Type "application/x-www-form-urlencoded";
            proxy_set_header  X-LEMONADE "Lemonade test";

            proxy_pass http://thorn/auth/validate;

            proxy_pass_request_body off; # no need to send the POST body
                proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;


            proxy_cache           token_responses;
            # the verdict depends on method, URI (public/unprotected/?token=) and credentials
            proxy_cache_key       "$request_method|$request_uri|$http_authorization|$http_x_auth_token|$http_x_thorn_id";
            proxy_cache_lock      on;
            proxy_cache_valid     200 10s;
            proxy_ignore_headers  Cache-Control Expires Set-Cookie;
        }
        # URLs not requiring authentication
        location /socket.io {
            proxy_set_header X-User-Id "";
            proxy_set_header X-Permissions "";
            proxy_set_header X-User-Data "";
            proxy_set_header X-User-Locale "";
            proxy_pass http://stand/socket.io;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
        location /app/ {
            # no auth_request here: never trust identity headers from the client
            proxy_set_header X-User-Id "";
            proxy_set_header X-Permissions "";
            proxy_set_header X-User-Data "";
            proxy_set_header X-User-Locale "";
            location /app/caipirinha/ {
                proxy_pass http://caipirinha/;
            }
            location /app/limonero/ {
                proxy_pass http://limonero/;
            }
            # location /app/seed/ {
            #    proxy_pass http://seed/;
            #}
            location /app/stand/ {
                proxy_pass http://stand/;
            }
            location /app/tahiti/ {
                proxy_pass http://tahiti/;
            }
            location /app/thorn/ {
                proxy_pass http://thorn/;
            }
        }
        location = /login {
            proxy_set_header X-User-Id "";
            proxy_set_header X-Permissions "";
            proxy_set_header X-User-Data "";
            proxy_set_header X-User-Locale "";
            proxy_pass http://thorn/auth/login;
        }
        #location = /register {
        #    proxy_pass http://thorn/users;
        #}
        location /sockjs-node {
            proxy_pass http://localhost:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        location = /tokens {
            proxy_pass http://thorn/auth/validate;
        }

        location = /auth/validate {
            proxy_pass http://thorn/auth/validate;
        }
        location /api/v1/ {
            auth_request /auth/internal;
            auth_request_set     $user $upstream_http_X_User_Id;
            auth_request_set     $userData $upstream_http_X_User_Data;
            auth_request_set     $userLocale $upstream_http_X_User_Locale;
            auth_request_set     $permissions $upstream_http_X_Permissions;

            proxy_set_header X-User-Id $user;
            proxy_set_header X-Permissions $permissions;
            proxy_set_header X-User-Data $userData;
            proxy_set_header X-User-Locale $userLocale;
            proxy_set_header Authorization "";

            location /api/v1/caipirinha/ {
                proxy_pass http://caipirinha/;
            }
            #location /api/v1/seed/ {
            #    proxy_pass http://seed/;
            #}
            location /api/v1/limonero/ {
                proxy_pass http://limonero/;
            }
            location /api/v1/stand/ {
                proxy_pass http://stand/;
            }
            location /api/v1/tahiti/ {
                proxy_pass http://tahiti/;
            }
            location /api/v1/thorn/ {
                proxy_pass http://thorn/;
            }
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
    error_page   500 502 503 504 /50x.html;
    location = /50x.html {
        root   /app;
    }
}

